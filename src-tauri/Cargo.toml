[package]
name = "proofread"
version = "1.0.0"
description = "A focused visual novel translation review tool"
authors = ["LightYuki"]
license = "GPL-3.0-or-later"
repository = "https://github.com/LightYuki/Proofreader"
homepage = "https://github.com/LightYuki/Proofreader"
rust-version = "1.96"
publish = false
edition = "2021"

[lib]
name = "proofread_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
